services:
  - type: web
    name: kezza-clinic
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node kezza-server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://kezza-clinic.onrender.com"
